<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Breaker Hub | Play & Climb</title>
    <!-- Keep your original verification meta tag intact -->
    <meta name="monetag" content="da34f404fa3a2ca3cbfd5c643be3d463">
    <style>
        :root {
            --bg-color: #05060b;
            --panel-bg: rgba(17, 19, 31, 0.85);
            --panel-border: #1f2336;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-yellow: #ffea00;
            --neon-red: #ff3131;
            --text-muted: #8b94b5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, rgba(5, 6, 11, 0.88), rgba(9, 10, 16, 0.95)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }

        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        .btn {
            background: transparent; color: #fff; border: 2px solid var(--neon-magenta);
            padding: 10px 24px; font-weight: bold; text-transform: uppercase;
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            text-decoration: none; display: inline-block;
        }
        .btn:hover { background: var(--neon-magenta); box-shadow: 0 0 20px rgba(255, 0, 127, 0.6); }
        .btn-cyan { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .btn-cyan:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
        
        header { 
            background: rgba(17, 19, 31, 0.95); 
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--panel-border); 
            padding: 15px 0;
            position: sticky; top: 0; z-index: 100;
        }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; letter-spacing: 2px; color: var(--neon-cyan); font-size: 1.3rem; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.95rem; font-weight: 600; text-transform: uppercase; }
        .nav-links a:hover { color: var(--neon-magenta); }

        .hero { text-align: center; padding: 80px 20px; position: relative; }
        .hero h1 { font-size: 4rem; text-transform: uppercase; letter-spacing: 4px; color: #fff; margin-bottom: 5px; text-shadow: 0 0 20px rgba(0, 240, 255, 0.6), 0 0 40px rgba(255, 0, 127, 0.3); }
        .hero p { color: #fff; font-size: 1.3rem; margin-bottom: 30px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .ad-container-wrapper {
            margin: 40px auto; max-width: 728px; display: flex; flex-direction: column; align-items: center;
        }
        .ad-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .ad-banner-slot {
            background: rgba(11, 12, 20, 0.8); border: 1px dashed var(--panel-border); backdrop-filter: blur(4px);
            width: 100%; min-height: 90px; display: flex; justify-content: center; align-items: center;
        }

        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; margin-bottom: 5px; }
        .panel { background: var(--panel-bg); border: 2px solid var(--panel-border); border-radius: 8px; padding: 25px; backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel h3 { text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; color: #fff; }
        
        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table tr { border-bottom: 1px solid #1a1d2f; }
        .leaderboard-table td { padding: 12px 8px; font-weight: 600; }
        .rank { width: 40px; font-weight: 800; }
        .rank-1 { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 234, 0, 0.5); }
        .rank-2 { color: #bdc3c7; }
        .rank-3 { color: #cd7f32; }
        .score-col { text-align: right; color: var(--neon-cyan); }

        .profile-card p { margin-bottom: 12px; font-weight: 600; color: var(--text-muted); }
        .profile-card span { color: #fff; float: right; }
        .profile-card .btn { width: 100%; margin-top: 15px; }

        .stats-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: center; margin-top: 20px; }
        .stat-box { background: rgba(12, 14, 23, 0.8); padding: 15px; border-radius: 6px; border: 1px solid var(--panel-border); }
        .stat-box font { font-size: 1.6rem; font-weight: 800; color: var(--neon-cyan); }
        .highlights-list { margin-top: 25px; list-style: none; }
        .highlights-list li { padding: 10px 0; border-top: 1px solid var(--panel-border); font-weight: 600; }
        .highlights-list label { color: var(--text-muted); }
        .highlights-list span { float: right; color: var(--neon-magenta); }

        /* Game Arena Section styling modules */
        .game-viewport-section { background: rgba(6, 7, 10, 0.7); padding: 40px 0; text-align: center; backdrop-filter: blur(4px); }
        .canvas-frame-container { position: relative; display: inline-block; background: #11131f; padding: 15px; border-radius: 12px; border: 2px solid var(--neon-cyan); box-shadow: 0 0 35px rgba(0, 240, 255, 0.15); max-width: 100%; }
        iframe { width: 800px; height: 500px; border: none; background: #000; border-radius: 6px; display: block; max-width: 100%; }
        
        .viewport-controls { margin-top: 15px; display: flex; justify-content: center; gap: 15px; }

        /* 🔐 EMAIL AUTH MODAL DIALOG COMPONENT */
        .auth-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(5,6,11,0.9);
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
            z-index: 200; visibility: hidden; opacity: 0; transition: all 0.3s ease;
        }
        .auth-overlay.show { visibility: visible; opacity: 1; }
        .auth-modal {
            background: #11131f; border: 2px solid var(--neon-cyan); width: 100%; max-width: 400px;
            padding: 30px; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); position: relative;
        }
        .auth-modal h2 { text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-size: 1.5rem; text-shadow: 0 0 10px var(--neon-cyan); text-align: center;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .form-group input {
            width: 100%; background: #06070a; border: 1px solid var(--panel-border); padding: 12px;
            color: #fff; font-size: 1rem; border-radius: 4px; outline: none; transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--neon-magenta); box-shadow: 0 0 10px rgba(255,0,127,0.2); }
        .close-auth { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .close-auth:hover { color: var(--neon-red); }

        footer { background: #07080d; border-top: 1px solid var(--panel-border); padding: 30px 0; color: var(--text-muted); font-size: 0.9rem; }
        .footer-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .social-links { display: flex; list-style: none; gap: 20px; }
        .social-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
        .social-links a:hover { color: #fff; }

        @media (max-width: 850px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            iframe { width: 100%; height: 450px; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container nav-wrapper">
            <div class="logo">🎮 NEON BREAKER</div>
            <ul class="nav-links">
                <li><a href="#play">Play</a></li>
                <li><a href="#leaderboard">Leaderboard</a></li>
                <li><a href="#rules">How to Play</a></li>
            </ul>
            <button class="btn btn-cyan" onclick="toggleAuthModal(true)" style="padding: 6px 16px; font-size: 0.85rem;">Login</button>
        </div>
    </header>

    <!-- 🔐 ACCOUNT AUTHENTICATION LIGHTBOX MODAL -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <span class="close-auth" onclick="toggleAuthModal(false)">&times;</span>
            <h2 id="modalTitle">Arcade Login</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-cyan" style="width:100%; margin-top: 10px;">Access Station</button>
